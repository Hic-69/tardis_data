## EPITECH PROJECT, 2026
## TARDIS
## File description:
## CI : coding style (ruff), tests (pytest), mirroring vers le repo Epitech

name: tardis

"on":
  push:
  pull_request:

# En trinome, on ne garde que le dernier run par branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIRROR_SSH_URL: "git@github.com:EpitechPGE1-2025/G-AIA-210-COT-2-2-tardis-2.git"
  PYTHON_VERSION: "3.11"
  # Livrables imposes par le sujet (model.pkl OU model.joblib accepte)
  DELIVERABLES: >-
    requirements.txt,notebooks/tardis_eda.ipynb,notebooks/tardis_model.ipynb,
    cleaned_dataset.csv,model.pkl,model.joblib,tardis_dashboard.py,README.md

jobs:
  # ---------------------------------------------------------------------------
  # 1. Coding style : ruff format (impose par le sujet) + ruff check
  # ---------------------------------------------------------------------------
  coding_style:
    name: Coding style (ruff)
    if: ${{ !contains(github.repository, 'EpitechPGE1-2025') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install --disable-pip-version-check ruff

      - name: Check formatting
        run: |
          if ! ruff format --check .; then
            echo "::error::Code non formate. Lance 'ruff format .' en local."
            exit 1
          fi

      - name: Lint
        run: ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # 2. Tests : validation du fichier genere cleaned_dataset.csv
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (pytest)
    if: ${{ !contains(github.repository, 'EpitechPGE1-2025') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run pytest
        timeout-minutes: 5
        run: |
          set +e
          pytest -v tests/
          code=$?
          set -e
          # exit 5 = aucun test collecte : tolere tant que les tests ne sont pas ecrits
          if [ "$code" -eq 5 ]; then
            echo "::warning::Aucun test collecte dans tests/"
            exit 0
          fi
          exit $code

  # ---------------------------------------------------------------------------
  # 3. Mirroring : push vers le repo Epitech, uniquement sur push main
  # ---------------------------------------------------------------------------
  push_to_mirror:
    name: Push to Epitech mirror
    needs: [coding_style, tests]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && !contains(github.repository, 'EpitechPGE1-2025')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Le projet est en cours : on pousse des qu'au moins un livrable existe.
      # Si aucun n'existe, le job se termine proprement sans pousser.
      - name: Check deliverables
        id: check
        run: |
          found=()
          missing=()
          IFS=',' read -ra files <<< "$(echo "$DELIVERABLES" | tr -d ' \n')"
          for f in "${files[@]}"; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then found+=("$f"); else missing+=("$f"); fi
          done
          echo "## Livrables" >> "$GITHUB_STEP_SUMMARY"
          for f in "${found[@]}";   do echo "- ✅ \`$f\`" >> "$GITHUB_STEP_SUMMARY"; done
          for f in "${missing[@]}"; do echo "- ❌ \`$f\` (manquant)" >> "$GITHUB_STEP_SUMMARY"; done
          echo "Livrables presents : ${found[*]:-aucun}"
          echo "Livrables manquants : ${missing[*]:-aucun}"
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::notice::Aucun livrable : mirroring saute."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Strip CI workflows from history before mirroring
        if: steps.check.outputs.proceed == 'true'
        run: |
          pip install --user --quiet git-filter-repo
          ~/.local/bin/git-filter-repo --force --invert-paths \
            --path .github/workflows

      - name: Set up SSH key
        if: steps.check.outputs.proceed == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}

      - name: Add mirror host to known_hosts
        if: steps.check.outputs.proceed == 'true'
        run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Push filtered branch to mirror
        if: steps.check.outputs.proceed == 'true'
        run: |
          git push --force "$MIRROR_SSH_URL" \
            "HEAD:refs/heads/${{ github.ref_name }}"
